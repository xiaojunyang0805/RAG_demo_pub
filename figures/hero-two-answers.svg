<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc" class="root">
<title id="title">Same question, two retrievals</title>
<desc id="desc">For the question "What is the phase current limit?" on the Halyard example corpus, plain hybrid retrieval returns three history chunks that all state 25 A, superseded in May. Truth-aware retrieval returns three current chunks that all state 32 A, the measured value.</desc>
<style>
  .root { --surface:#fcfcfb; --card:#f3f2ee; --t1:#0b0b0b; --t2:#52514e; --line:#dcdbd6;
          --cur:#0a6b37; --curbg:#d7f0df; --hist:#8a5300; --histbg:#fbe8c4; --arch:#b02a2a; --archbg:#f8dcdc;
          --bad:#b02a2a; --good:#0a6b37; }
  @media (prefers-color-scheme: dark) {
    .root { --surface:#1a1a19; --card:#232322; --t1:#f0efec; --t2:#c3c2b7; --line:#3a3a37;
            --cur:#7ad69c; --curbg:#173323; --hist:#f0b95a; --histbg:#3a2c12; --arch:#f08a8a; --archbg:#3d1c1c;
            --bad:#f08a8a; --good:#7ad69c; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--t1); }
  .t2 { fill: var(--t2); } .mono, .mono text { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-variant-ligatures: none; }
  .card { fill: var(--card); stroke: var(--line); }
  .b-cur { fill: var(--curbg); } .b-cur-t { fill: var(--cur); }
  .b-hist { fill: var(--histbg); } .b-hist-t { fill: var(--hist); }
  .b-arch { fill: var(--archbg); } .b-arch-t { fill: var(--arch); }
  .bad { fill: var(--bad); } .good { fill: var(--good); }
</style>
<rect width="960" height="470" rx="10" fill="var(--surface)"/>

<text x="28" y="40" font-size="13" class="t2">QUESTION</text>
<text x="28" y="66" font-size="22" font-weight="600">“What is the phase current limit?”</text>

<!-- left card: plain hybrid -->
<rect class="card" x="28" y="92" width="440" height="318" rx="10"/>
<text x="48" y="122" font-size="15" font-weight="600">Plain hybrid retrieval</text>
<text x="48" y="141" font-size="12" class="t2">BM25 + vectors, fused — what most RAG systems hand the model</text>

<g transform="translate(48,160)">
  <rect class="b-arch" width="70" height="20" rx="4"/><text class="b-arch-t" x="35" y="14" font-size="11" font-weight="700" text-anchor="middle">ARCHIVE</text>
  <text x="80" y="14" font-size="12" class="mono t2">archive/PowerStage_Concept_v1.md</text>
  <text x="0" y="40" font-size="13">“…current limit of the Halyard drive is <tspan font-weight="700">25 A</tspan>.”</text>
</g>
<g transform="translate(48,232)">
  <rect class="b-hist" width="70" height="20" rx="4"/><text class="b-hist-t" x="35" y="14" font-size="11" font-weight="700" text-anchor="middle">HISTORY</text>
  <text x="80" y="14" font-size="12" class="mono t2">HB-P worknote § Rev A bring-up</text>
  <text x="0" y="40" font-size="13">“Phase current limit set at <tspan font-weight="700">25 A</tspan> in firmware…”</text>
</g>
<g transform="translate(48,304)">
  <rect class="b-arch" width="70" height="20" rx="4"/><text class="b-arch-t" x="35" y="14" font-size="11" font-weight="700" text-anchor="middle">ARCHIVE</text>
  <text x="80" y="14" font-size="12" class="mono t2">archive/PowerStage_Concept_v1.md</text>
  <text x="0" y="40" font-size="13">“Phase current limit: <tspan font-weight="700">25 A</tspan> peak…”</text>
</g>
<line x1="48" x2="448" y1="368" y2="368" stroke="var(--line)"/>
<text x="48" y="393" font-size="14" font-weight="600" class="bad">✗ All three say 25 A — superseded in May</text>

<!-- right card: truth-aware -->
<rect class="card" x="492" y="92" width="440" height="318" rx="10"/>
<text x="512" y="122" font-size="15" font-weight="600">Truth-aware retrieval</text>
<text x="512" y="141" font-size="12" class="t2">the same search, × a weight for how current each source is</text>

<g transform="translate(512,232)">
  <rect class="b-cur" width="70" height="20" rx="4"/><text class="b-cur-t" x="35" y="14" font-size="11" font-weight="700" text-anchor="middle">CURRENT</text>
  <text x="80" y="14" font-size="12" class="mono t2">HB-P DesignNote § 5. Connector</text>
  <text x="0" y="40" font-size="13">“Phase currents up to <tspan font-weight="700">32 A</tspan> need the 7.62 mm block…”</text>
</g>
<g transform="translate(512,304)">
  <rect class="b-cur" width="70" height="20" rx="4"/><text class="b-cur-t" x="35" y="14" font-size="11" font-weight="700" text-anchor="middle">CURRENT</text>
  <text x="80" y="14" font-size="12" class="mono t2">HB-P DesignNote § 2. DC link</text>
  <text x="0" y="40" font-size="13">“…9.8 A rms ripple at <tspan font-weight="700">32 A</tspan> phase current…”</text>
</g>
<g transform="translate(512,160)">
  <rect class="b-cur" width="70" height="20" rx="4"/><text class="b-cur-t" x="35" y="14" font-size="11" font-weight="700" text-anchor="middle">CURRENT</text>
  <text x="80" y="14" font-size="12" class="mono t2">Commissioning Guide § 2. First power</text>
  <text x="0" y="40" font-size="13">“…check … current limit = <tspan font-weight="700">32 A</tspan>…”</text>
</g>
<line x1="512" x2="912" y1="368" y2="368" stroke="var(--line)"/>
<text x="512" y="393" font-size="14" font-weight="600" class="good">✓ All three say 32 A — the measured value</text>

<text x="28" y="446" font-size="12" class="t2">Top 3 chunks for the same question on the Halyard example corpus (real output of <tspan class="mono">truthrag search</tspan>). A model can only be as current as what it is handed.</text>
</svg>
