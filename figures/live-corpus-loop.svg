<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc" class="root">
<title id="title">The evaluation as a corpus check</title>
<desc id="desc">A loop. The corpus changes and gets a new commit. Ingest records that commit. The golden-set check runs. A FAIL means a question is no longer valid, so fix the question. A WARN means a current document still states a superseded value, so fix the document and add the wording to the retired-terms table. Then re-ingest. Every result row carries the corpus commit it measured.</desc>
<style>
  .root { --surface:#fcfcfb; --box:#f3f2ee; --t1:#0b0b0b; --t2:#52514e; --line:#b9b8b2; --acc:#2a78d6; --accbg:#e3eefb;
          --warn:#8a5300; --warnbg:#fbe8c4; --fail:#b02a2a; --failbg:#f8dcdc; }
  @media (prefers-color-scheme: dark) {
    .root { --surface:#1a1a19; --box:#262624; --t1:#f0efec; --t2:#c3c2b7; --line:#5a5955; --acc:#5b9ded; --accbg:#1d2a3b;
            --warn:#f0b95a; --warnbg:#3a2c12; --fail:#f08a8a; --failbg:#3d1c1c; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--t1); }
  .t2 { fill: var(--t2); } .mono, .mono text { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-variant-ligatures: none; }
  .box { fill: var(--box); stroke: var(--line); } .acc { fill: var(--accbg); stroke: var(--acc); stroke-width: 1.5; }
  .warn { fill: var(--warnbg); stroke: var(--warn); } .warn-t { fill: var(--warn); }
  .fail { fill: var(--failbg); stroke: var(--fail); } .fail-t { fill: var(--fail); }
  .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; marker-end: url(#h); }
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker></defs>
<rect width="960" height="400" rx="10" fill="var(--surface)"/>
<text x="28" y="38" font-size="18" font-weight="600">The evaluation doubles as a check on the documents</text>

<rect class="box" x="40" y="150" width="150" height="70" rx="8"/>
<text x="115" y="180" font-size="14" font-weight="600" text-anchor="middle">Corpus changes</text>
<text x="115" y="200" font-size="12" class="t2 mono" text-anchor="middle">new commit</text>

<rect class="box" x="240" y="150" width="150" height="70" rx="8"/>
<text x="315" y="180" font-size="14" font-weight="600" text-anchor="middle">Ingest</text>
<text x="315" y="200" font-size="12" class="t2" text-anchor="middle">records the commit</text>

<rect class="acc" x="440" y="150" width="170" height="70" rx="8"/>
<text x="525" y="180" font-size="14" font-weight="600" text-anchor="middle">Check golden set</text>
<text x="525" y="200" font-size="12" class="t2 mono" text-anchor="middle">eval --check</text>

<rect class="fail" x="680" y="74" width="250" height="78" rx="8"/>
<text x="696" y="100" font-size="13" font-weight="700" class="fail-t">FAIL — a question is invalid</text>
<text x="696" y="120" font-size="12" class="t2">evidence gone, or a refusal became</text>
<text x="696" y="136" font-size="12" class="t2">answerable → fix the question</text>

<rect class="warn" x="680" y="200" width="250" height="96" rx="8"/>
<text x="696" y="226" font-size="13" font-weight="700" class="warn-t">WARN — a current document</text>
<text x="696" y="244" font-size="13" font-weight="700" class="warn-t">states a superseded value</text>
<text x="696" y="264" font-size="12" class="t2">fix the document, add the wording</text>
<text x="696" y="280" font-size="12" class="t2">to the retired-terms table</text>

<path class="arrow" d="M190,185 H238"/><path class="arrow" d="M390,185 H438"/>
<path class="arrow" d="M610,175 C640,175 650,113 678,113"/><path class="arrow" d="M610,195 C640,195 650,248 678,248"/>
<path class="arrow" d="M805,296 V340 H115 V222"/>
<text x="460" y="332" font-size="12" class="t2" text-anchor="middle">re-ingest — only changed chunks are re-embedded</text>

<text x="28" y="378" font-size="12" class="t2">Every result row records the corpus commit it measured, so a score always says which version of the documents it is about.</text>
</svg>
