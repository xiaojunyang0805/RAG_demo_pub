<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="title desc" class="root">
<title id="title">Retrieval ablation: truth weighting</title>
<desc id="desc">Grouped bars of hit@5 and stale-truth for BM25, vector, hybrid and hybrid with truth weighting, on the example corpus and on a real project. Values are listed in the README table.</desc>
<style>
  .root { --surface:#fcfcfb; --t1:#0b0b0b; --t2:#52514e; --grid:#e3e2de; --band:#f1f0ec; --s1:#2a78d6; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    .root { --surface:#1a1a19; --t1:#f0efec; --t2:#c3c2b7; --grid:#33332f; --band:#242422; --s1:#3987e5; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--t1); }
  .t2 { fill: var(--t2); } .s1 { fill: var(--s1); } .s2 { fill: var(--s2); }
  .grid { stroke: var(--grid); stroke-width: 1; } .base { stroke: var(--t2); stroke-width: 1; }
</style>
<rect width="960" height="450" rx="10" fill="var(--surface)"/>
<text x="28" y="36" font-size="18" font-weight="600">Truth weighting puts current sources first</text>
<rect x="28" y="52" width="12" height="12" rx="2" class="s1"/><text x="46" y="62" font-size="12">hit@5 — a relevant chunk in the top 5</text>
<rect x="300" y="52" width="12" height="12" rx="2" class="s2"/><text x="318" y="62" font-size="12">top-1 is current — the best-ranked chunk is not history</text>
<text x="28" y="92" font-size="15" font-weight="600">Example corpus (Halyard)</text>
<text x="28" y="110" font-size="12" class="t2">20 documents · 21 questions · synthetic, built to show the effect</text>
