<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="title desc" class="root">
<title id="title">How the top 8 changes when truth weights are applied</title>
<desc id="desc">Question: what is the phase current limit, on the Halyard corpus. Plain hybrid top 8: ranks 1 to 3 and 6 are history chunks stating 25 A; ranks 4, 5, 7 and 8 are current chunks stating 32 A. With truth weights the four current chunks move to ranks 1 to 4, the four history chunks leave the top 8, and four more current sources enter at ranks 5 to 8. Every chunk in the new top 8 states 32 A.</desc>
<style>
  .root { --surface:#fcfcfb; --t1:#0b0b0b; --t2:#52514e; --line:#c9c8c2;
          --cur:#0a6b37; --curbg:#d7f0df; --hist:#8a5300; --histbg:#fbe8c4; --arch:#b02a2a; --archbg:#f8dcdc; }
  @media (prefers-color-scheme: dark) {
    .root { --surface:#1a1a19; --t1:#f0efec; --t2:#c3c2b7; --line:#4a4945;
            --cur:#7ad69c; --curbg:#173323; --hist:#f0b95a; --histbg:#3a2c12; --arch:#f08a8a; --archbg:#3d1c1c; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--t1); }
  .t2 { fill: var(--t2); }
  .up { stroke: var(--cur); stroke-width: 2.5; fill: none; }
  .out { stroke: var(--hist); stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
  .k-cur { fill: var(--curbg); stroke: var(--cur); } .k-hist { fill: var(--histbg); stroke: var(--hist); }
  .k-arch { fill: var(--archbg); stroke: var(--arch); }
  .v-cur { fill: var(--cur); } .v-old { fill: var(--hist); } .v-arch { fill: var(--arch); }
</style>
<rect width="960" height="460" rx="10" fill="var(--surface)"/>
<text x="28" y="38" font-size="18" font-weight="600">Truth weights reorder the same candidates</text>
<text x="28" y="60" font-size="12" class="t2">“What is the phase current limit?” — Halyard corpus, real output. Rows: rank 1 (top) to 8.</text>
<text x="40" y="92" font-size="12" font-weight="700" class="t2">PLAIN HYBRID</text>
<text x="600" y="92" font-size="12" font-weight="700" class="t2">HYBRID + TRUTH WEIGHTS</text>

<!-- row y = 120 + (rank-1)*40 ; left nodes x 40..360, right nodes x 600..920 -->
<!-- connectors: left 4->1, 5->2, 7->3, 8->4 -->
<path class="up" d="M360,240 C480,240 480,120 600,120"/>
<path class="up" d="M360,280 C480,280 480,160 600,160"/>
<path class="up" d="M360,360 C480,360 480,200 600,200"/>
<path class="up" d="M360,400 C480,400 480,240 600,240"/>
<!-- leaving the top 8 -->
<path class="out" d="M360,120 C420,120 430,436 470,436"/>
<path class="out" d="M360,160 C420,160 430,436 470,436"/>
<path class="out" d="M360,200 C420,200 430,436 470,436"/>
<path class="out" d="M360,320 C420,320 430,436 470,436"/>
<text x="478" y="440" font-size="11" class="v-old">out of the top 8</text>

<g font-size="12">
  <rect class="k-arch" x="40" y="106" width="320" height="28" rx="5"/><text x="50" y="124">1  concept v1 § Current limit</text><text x="350" y="124" text-anchor="end" font-weight="700" class="v-arch">archive · 25 A</text>
  <rect class="k-hist" x="40" y="146" width="320" height="28" rx="5"/><text x="50" y="164">2  HB-P worknote § Rev A bring-up</text><text x="350" y="164" text-anchor="end" font-weight="700" class="v-old">history · 25 A</text>
  <rect class="k-arch" x="40" y="186" width="320" height="28" rx="5"/><text x="50" y="204">3  concept v1 § Summary</text><text x="350" y="204" text-anchor="end" font-weight="700" class="v-arch">archive · 25 A</text>
  <rect class="k-cur" x="40" y="226" width="320" height="28" rx="5"/><text x="50" y="244">4  Commissioning § First power</text><text x="350" y="244" text-anchor="end" font-weight="700" class="v-cur">current · 32 A</text>
  <rect class="k-cur" x="40" y="266" width="320" height="28" rx="5"/><text x="50" y="284">5  HB-P DesignNote § Connector</text><text x="350" y="284" text-anchor="end" font-weight="700" class="v-cur">current · 32 A</text>
  <rect class="k-hist" x="40" y="306" width="320" height="28" rx="5"/><text x="50" y="324">6  Decision log § Early decisions</text><text x="350" y="324" text-anchor="end" font-weight="700" class="v-old">history · 25 A</text>
  <rect class="k-cur" x="40" y="346" width="320" height="28" rx="5"/><text x="50" y="364">7  HB-P DesignNote § DC link</text><text x="350" y="364" text-anchor="end" font-weight="700" class="v-cur">current · 32 A</text>
  <rect class="k-cur" x="40" y="386" width="320" height="28" rx="5"/><text x="50" y="404">8  Parameters § Notes</text><text x="350" y="404" text-anchor="end" font-weight="700" class="v-cur">current · 32 A</text>

  <rect class="k-cur" x="600" y="106" width="320" height="28" rx="5"/><text x="610" y="124">1  Commissioning § First power</text><text x="910" y="124" text-anchor="end" font-weight="700" class="v-cur">32 A</text>
  <rect class="k-cur" x="600" y="146" width="320" height="28" rx="5"/><text x="610" y="164">2  HB-P DesignNote § Connector</text><text x="910" y="164" text-anchor="end" font-weight="700" class="v-cur">32 A</text>
  <rect class="k-cur" x="600" y="186" width="320" height="28" rx="5"/><text x="610" y="204">3  HB-P DesignNote § DC link</text><text x="910" y="204" text-anchor="end" font-weight="700" class="v-cur">32 A</text>
  <rect class="k-cur" x="600" y="226" width="320" height="28" rx="5"/><text x="610" y="244">4  Parameters § Notes</text><text x="910" y="244" text-anchor="end" font-weight="700" class="v-cur">32 A</text>
  <rect class="k-cur" x="600" y="266" width="320" height="28" rx="5"/><text x="610" y="284">5  Decision log § §0 current state</text><text x="910" y="284" text-anchor="end" font-weight="700" class="v-cur">new · 32 A</text>
  <rect class="k-cur" x="600" y="306" width="320" height="28" rx="5"/><text x="610" y="324">6  Parameters § table (P-02)</text><text x="910" y="324" text-anchor="end" font-weight="700" class="v-cur">new · 32 A</text>
  <rect class="k-cur" x="600" y="346" width="320" height="28" rx="5"/><text x="610" y="364">7  Design note § Decisions</text><text x="910" y="364" text-anchor="end" font-weight="700" class="v-cur">new · 32 A</text>
  <rect class="k-cur" x="600" y="386" width="320" height="28" rx="5"/><text x="610" y="404">8  HB-P worknote § §0 current state</text><text x="910" y="404" text-anchor="end" font-weight="700" class="v-cur">new · 32 A</text>
</g>
</svg>
