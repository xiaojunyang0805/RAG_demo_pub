<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc" class="root">
<title id="title">Anatomy of a golden-set question</title>
<desc id="desc">A stale-truth question from the Halyard golden set: id S01, question what is the phase current limit, evidence 32 A, must 32 A, stale 25 A. Evidence marks a relevant chunk by text, not file path, so the set survives re-chunking; it must be a current chunk. Must is what the answer has to contain. Stale is the superseded value: a line states it unless the line marks itself as history. Refusal questions carry an absent pattern that must match no chunk.</desc>
<style>
  .root { --surface:#fcfcfb; --code:#f3f2ee; --t1:#0b0b0b; --t2:#52514e; --line:#b9b8b2; --key:#2a78d6; --str:#0a6b37; --stale:#8a5300; }
  @media (prefers-color-scheme: dark) {
    .root { --surface:#1a1a19; --code:#262624; --t1:#f0efec; --t2:#c3c2b7; --line:#5a5955; --key:#5b9ded; --str:#7ad69c; --stale:#f0b95a; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--t1); }
  .t2 { fill: var(--t2); } .mono, .mono text { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-variant-ligatures: none; }
  .key { fill: var(--key); } .str { fill: var(--str); } .st { fill: var(--stale); }
  .lead { stroke: var(--line); stroke-width: 1.5; fill: none; }
</style>
<rect width="960" height="420" rx="10" fill="var(--surface)"/>
<text x="28" y="38" font-size="18" font-weight="600">One golden-set question, and what each field checks</text>

<rect x="28" y="64" width="420" height="230" rx="8" fill="var(--code)"/>
<g font-size="14" class="mono">
  <text x="48" y="100"><tspan class="key">id</tspan>: S01</text>
  <text x="48" y="130"><tspan class="key">category</tspan>: stale</text>
  <text x="48" y="160"><tspan class="key">question</tspan>: "What is the phase</text>
  <text x="48" y="180">           current limit?"</text>
  <text x="48" y="212"><tspan class="key">evidence</tspan>: <tspan class="str">'32 ?A'</tspan></text>
  <text x="48" y="242"><tspan class="key">must</tspan>:     [<tspan class="str">'32 ?A'</tspan>]</text>
  <text x="48" y="272"><tspan class="key">stale</tspan>:    <tspan class="st">'25 ?A'</tspan></text>
</g>

<path class="lead" d="M300,207 H500"/><path class="lead" d="M300,237 C400,237 420,272 500,272"/><path class="lead" d="M300,267 C400,267 420,342 500,342"/>
<path class="lead" d="M300,125 C400,125 420,124 500,124"/>

<text x="510" y="118" font-size="14" font-weight="700">category</text>
<text x="510" y="138" font-size="12" class="t2">fact · exact ID · stale · multi-hop · refusal · redaction —</text>
<text x="510" y="154" font-size="12" class="t2">so a failure points at a cause, not just a score</text>

<text x="510" y="202" font-size="14" font-weight="700">evidence → retrieval: hit@5, MRR</text>
<text x="510" y="222" font-size="12" class="t2">a text pattern, not a file path, so it survives re-chunking;</text>
<text x="510" y="238" font-size="12" class="t2">for fact and stale questions the chunk must be <tspan font-weight="700">current</tspan></text>

<text x="510" y="268" font-size="14" font-weight="700">must → answer correctness</text>
<text x="510" y="288" font-size="12" class="t2">every pattern must appear in the answer (plus an optional LLM judge)</text>

<text x="510" y="338" font-size="14" font-weight="700" class="st">stale → stale-truth, retrieval and answer</text>
<text x="510" y="358" font-size="12" class="t2">the first top-5 chunk stating either value must state the current one;</text>
<text x="510" y="374" font-size="12" class="t2">"was 25 A" does not count as stating it</text>

<text x="28" y="330" font-size="13" font-weight="600">Refusal questions add one more field:</text>
<text x="28" y="354" font-size="14" class="mono"><tspan class="key">absent</tspan>: <tspan class="str">'(?i)warranty'</tspan></text>
<text x="28" y="378" font-size="12" class="t2">must match no chunk — checked on every ingest,</text>
<text x="28" y="394" font-size="12" class="t2">so the question cannot quietly become answerable</text>
</svg>
