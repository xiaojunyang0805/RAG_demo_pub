# truthrag configuration for the Halyard example corpus. Paths are relative to this file.

corpus:
  root: .
  glob: "**/*.md"

truth:
  # Halyard marks each document with a header comment:  <!-- CONTRACT: STATE | REFERENCE | LOG -->
  header: '<!--\s*CONTRACT:\s*(STATE|REFERENCE|LOG)\b'
  header_classes: {STATE: current, REFERENCE: reference, LOG: log}
  archive_dirs: [archive]
  log_current_section: '§\s*0\b'          # "## §0 CURRENT STATE" in a LOG is current
  default: current
  retired_terms: docs/RetiredTerms.md

weights: {current: 1.0, log_current: 1.0, reference: 0.9, log: 0.5, archive: 0.2, retired_penalty: 0.5}

retrieval:
  top_k: 8
  candidates: 40
  min_vector_sim: 0.6
  cross_encoder: null                     # e.g. Xenova/ms-marco-MiniLM-L-6-v2 (~80 MB download)

llm:
  model: claude-sonnet-5-5
  eval_model: claude-haiku-5-5
  effort: medium

redact: redact.yaml
golden: golden.yaml
